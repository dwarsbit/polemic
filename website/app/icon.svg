<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E1B4B" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312E81" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(24 24)">
    <!-- App-icon achtergrond, met een strakke contactschaduw -->
    <g filter="url(#tileShadow)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
    </g>
    <!-- Lichtrand aan de bovenkant, naar onderen vervagend -->
    <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#highlight)" stroke-width="3"/>

    <!-- Backslash: elk LaTeX-commando begint hiermee -->
    <path d="M157 130 L307 380" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>

    <!-- Tekstcursor, als net getypt -->
    <rect x="353" y="230" width="26" height="150" rx="13" fill="#EC4899"/>
  </g>
</svg>
