<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(24 24)">
    <!-- Zachte gloed achter de tegel -->
    <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bg)" opacity="0.35" filter="url(#glow)"/>

    <g filter="url(#tileShadow)">
      <!-- App-icon achtergrond -->
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
      <!-- Subtiel binnenkader -->
      <rect x="25" y="25" width="462" height="462" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
    </g>

    <!-- Backslash: elk LaTeX-commando begint hiermee -->
    <path d="M157 130 L307 380" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>

    <!-- Tekstcursor, als net getypt -->
    <rect x="353" y="230" width="26" height="150" rx="13" fill="#EC4899"/>
  </g>
</svg>