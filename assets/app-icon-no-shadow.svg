<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Polemic app icon on the macOS grid: 824px tile in a 1024px canvas,
       corner radius 185.4, without the Dock shadow: the source for every
       platform icon except the macOS icns. Plum ground
       (#816682) with a subtle diagonal gradient and a non-repeating paper texture and a hairline border; the mark from
       assets/logo/polemic-mark.svg in white, at 62% of the tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B718C"/>
      <stop offset="0.5" stop-color="#816682"/>
      <stop offset="1" stop-color="#745A76"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Paper texture: one noise field over the whole tile (no pattern, so
         nothing repeats). Fine fractal grain plus a soft, low-frequency
         mottle, both turned into mauve-800 ink in the alpha channel. -->
    <filter id="paper" x="100" y="100" width="824" height="824" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="fine"/>
      <feColorMatrix in="fine" type="matrix" result="fineA" values="0 0 0 0 0.165  0 0 0 0 0.129  0 0 0 0 0.173  0 0 0 -1.6 1.05"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="11" result="soft"/>
      <feColorMatrix in="soft" type="matrix" result="softA" values="0 0 0 0 0.165  0 0 0 0 0.129  0 0 0 0 0.173  0 0 0 -1.2 0.75"/>
      <feMerge><feMergeNode in="softA"/><feMergeNode in="fineA"/></feMerge>
    </filter>
    <rect id="tile" x="100" y="100" width="824" height="824" rx="185.4"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>
  </defs>

  <use href="#tile" fill="url(#bg)"/>
  <g clip-path="url(#tileClip)" style="isolation:isolate">
    <use href="#tile" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" filter="url(#paper)" style="mix-blend-mode:multiply" opacity="0.1"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#highlight)" stroke-width="8" clip-path="url(#tileClip)"/>
  <!-- a hairline border in mauve-800 at 18%, inside the tile -->
  <use href="#tile" fill="none" stroke="#2A212C" stroke-opacity="0.18" stroke-width="6" clip-path="url(#tileClip)"/>

  <!-- the mark: screened at 86% so the ground's gradient and grain show
       through faintly and it sits in the surface rather than on it -->
  <g style="isolation:isolate"><g style="mix-blend-mode:screen" opacity="0.86" transform="translate(256.6 256.6) scale(5.1088)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="92" height="92" rx="14"/>
    <path d="M35.33 25.54 L64.67 74.46"/>
  </g></g>
</svg>
