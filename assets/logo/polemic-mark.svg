<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Polemic mark: an outlined, slightly rounded square with the backslash
       every LaTeX command starts with. Border and slash share one stroke
       weight (8 on 100). Uses currentColor, so it takes the text colour
       when inlined; standalone it renders black. -->
  <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="92" height="92" rx="14"/>
    <path d="M35.33 25.54 L64.67 74.46"/>
  </g>
</svg>
