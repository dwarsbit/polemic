<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Polemic app icon, white variant, for plum grounds (where the plum
       icon would disappear). Same macOS grid as assets/app-icon-no-shadow.svg:
       824px tile in a 1024px canvas, corner radius 185.4, no shadow. White
       ground with a faint diagonal gradient to mauve-100 and the website's
       wallpaper grain; the mark from assets/logo/polemic-mark.svg in mauve-800
       (#2A212C), at 62% of the tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FAF9FA"/>
      <stop offset="1" stop-color="#F3F1F3"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- The website's wallpaper grain, verbatim (components/elements/wallpaper.tsx):
         the 250px tile at 2x (500 here, as it renders on a retina screen), turbulence pushed to white, so the grain lives in the
         alpha channel; laid over the ground at 30% with overlay, as on the site. -->
    <pattern id="grain" patternUnits="userSpaceOnUse" width="500" height="500">
      <svg width="500" height="500" viewBox="0 0 100 100">
        <filter id="n">
          <feTurbulence type="turbulence" baseFrequency="1.4" numOctaves="1" seed="2" stitchTiles="stitch" result="n"/>
          <feComponentTransfer result="g">
            <feFuncR type="linear" slope="4" intercept="1"/>
            <feFuncG type="linear" slope="4" intercept="1"/>
            <feFuncB type="linear" slope="4" intercept="1"/>
          </feComponentTransfer>
          <feColorMatrix type="saturate" values="0" in="g"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#n)"/>
      </svg>
    </pattern>
    <rect id="tile" x="100" y="100" width="824" height="824" rx="185.4"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>
  </defs>

  <use href="#tile" fill="url(#bg)"/>
  <g clip-path="url(#tileClip)" style="isolation:isolate">
    <use href="#tile" fill="url(#bg)"/>
    <use href="#tile" fill="url(#grain)" style="mix-blend-mode:multiply" opacity="0.06"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#highlight)" stroke-width="8" clip-path="url(#tileClip)"/>

  <!-- the mark: multiplied in mauve-800, so the grain shows through faintly and
       it sits in the surface rather than on it -->
  <g style="isolation:isolate"><g style="mix-blend-mode:multiply" transform="translate(256.6 256.6) scale(5.1088)" fill="none" stroke="#2A212C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="92" height="92" rx="14"/>
    <path d="M35.33 25.54 L64.67 74.46"/>
  </g></g>
</svg>
