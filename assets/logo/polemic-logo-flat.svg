<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Polemic logo, full bleed: the app icon's tile without the Dock margin and
       shadow. Plum ground (#816682) with a subtle gradient, a non-repeating
       paper texture, a hairline border, and the mark (assets/logo/polemic-mark.svg) in
       white at 86%. Corner radius 22.5%, so rounded-md fits it at 28px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B718C"/>
      <stop offset="0.5" stop-color="#816682"/>
      <stop offset="1" stop-color="#745A76"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Paper texture: one noise field over the whole tile (no pattern, so
         nothing repeats). Fine fractal grain plus a soft, low-frequency
         mottle, both turned into mauve-800 ink in the alpha channel. -->
    <filter id="paper" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="7.004" numOctaves="3" seed="7" result="fine"/>
      <feColorMatrix in="fine" type="matrix" result="fineA" values="0 0 0 0 0.165  0 0 0 0 0.129  0 0 0 0 0.173  0 0 0 -1.6 1.05"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.0494" numOctaves="2" seed="11" result="soft"/>
      <feColorMatrix in="soft" type="matrix" result="softA" values="0 0 0 0 0.165  0 0 0 0 0.129  0 0 0 0 0.173  0 0 0 -1.2 0.75"/>
      <feMerge><feMergeNode in="softA"/><feMergeNode in="fineA"/></feMerge>
    </filter>
    <rect id="tile" width="100" height="100" rx="22.5"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)" style="isolation:isolate">
    <use href="#tile" fill="url(#bg)"/>
    <rect x="0" y="0" width="100" height="100" filter="url(#paper)" style="mix-blend-mode:multiply" opacity="0.1"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#highlight)" stroke-width="1" clip-path="url(#tileClip)"/>
  <!-- a hairline border in mauve-800 at 18%, inside the tile -->
  <use href="#tile" fill="none" stroke="#2A212C" stroke-opacity="0.18" stroke-width="0.7282" clip-path="url(#tileClip)"/>

  <g transform="translate(19 19) scale(0.62)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
    <rect x="4" y="4" width="92" height="92" rx="14"/>
    <path d="M35.33 25.54 L64.67 74.46"/>
  </g>
</svg>
