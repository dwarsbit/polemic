<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Polemic logo, full bleed: the app icon's tile without the Dock margin and
       shadow. Plum ground (#816682) with a subtle gradient, the site's wallpaper
       grain at 30% overlay, and the mark (assets/logo/polemic-mark.svg) in
       white at 86%. Corner radius 22.5%, so rounded-md fits it at 28px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B718C"/>
      <stop offset="0.5" stop-color="#816682"/>
      <stop offset="1" stop-color="#745A76"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="60.68" height="60.68">
      <svg width="60.68" height="60.68" viewBox="0 0 100 100">
        <filter id="n">
          <feTurbulence type="turbulence" baseFrequency="1.4" numOctaves="1" seed="2" stitchTiles="stitch" result="n"/>
          <feComponentTransfer result="g">
            <feFuncR type="linear" slope="4" intercept="1"/>
            <feFuncG type="linear" slope="4" intercept="1"/>
            <feFuncB type="linear" slope="4" intercept="1"/>
          </feComponentTransfer>
          <feColorMatrix type="saturate" values="0" in="g"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#n)"/>
      </svg>
    </pattern>
    <rect id="tile" width="100" height="100" rx="22.5"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)" style="isolation:isolate">
    <use href="#tile" fill="url(#bg)"/>
    <use href="#tile" fill="url(#grain)" style="mix-blend-mode:overlay" opacity="0.3"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#highlight)" stroke-width="1" clip-path="url(#tileClip)"/>

  <g transform="translate(19 19) scale(0.62)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
    <rect x="4" y="4" width="92" height="92" rx="14"/>
    <path d="M35.33 25.54 L64.67 74.46"/>
  </g>
</svg>
