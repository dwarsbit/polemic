<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <!-- In-app logo: the app icon (assets/app-icon.svg) on a 560 canvas, tile 480
       with a tight contact shadow. Same plum ground, website grain and mark. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B718C"/>
      <stop offset="0.5" stop-color="#816682"/>
      <stop offset="1" stop-color="#745A76"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E1B4B" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312E81" flood-opacity="0.12"/>
    </filter>
    <!-- Paper texture: one noise field over the whole tile (no pattern, so
         nothing repeats). Fine fractal grain plus a soft, low-frequency
         mottle, both turned into mauve-800 ink in the alpha channel. -->
    <filter id="paper" x="40" y="40" width="480" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.4592" numOctaves="3" seed="7" result="fine"/>
      <feColorMatrix in="fine" type="matrix" result="fineA" values="0 0 0 0 0.165  0 0 0 0 0.129  0 0 0 0 0.173  0 0 0 -1.6 1.05"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.0103" numOctaves="2" seed="11" result="soft"/>
      <feColorMatrix in="soft" type="matrix" result="softA" values="0 0 0 0 0.165  0 0 0 0 0.129  0 0 0 0 0.173  0 0 0 -1.2 0.75"/>
      <feMerge><feMergeNode in="softA"/><feMergeNode in="fineA"/></feMerge>
    </filter>
    <rect id="tile" x="40" y="40" width="480" height="480" rx="108.0"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>
  </defs>

  <use href="#tile" fill="url(#bg)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)" style="isolation:isolate">
    <use href="#tile" fill="url(#bg)"/>
    <rect x="40" y="40" width="480" height="480" filter="url(#paper)" style="mix-blend-mode:multiply" opacity="0.1"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#highlight)" stroke-width="4.7" clip-path="url(#tileClip)"/>
  <!-- a hairline border in mauve-800 at 18%, inside the tile -->
  <use href="#tile" fill="none" stroke="#2A212C" stroke-opacity="0.18" stroke-width="3.4951" clip-path="url(#tileClip)"/>

  <!-- the mark, screened at 86% -->
  <g style="isolation:isolate"><g style="mix-blend-mode:screen" opacity="0.86" transform="translate(131.2 131.2) scale(2.9760)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="92" height="92" rx="14"/>
    <path d="M35.33 25.54 L64.67 74.46"/>
  </g></g>
</svg>
