name: Release

# Releases a new version: sets the version everywhere, commits to main and
# pushes the tag vX.Y.Z, creates a draft GitHub Release with the version's
# changelog section as notes, then builds the installers for every
# platform and attaches them to it. Publish the draft by hand once the
# assets look right. Pushes use GITHUB_TOKEN, so they do not trigger
# other workflows: anything a release needs runs as a job here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, without the v)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Windows installers (MSI) only take numeric versions, so no pre-releases.
      - name: Validate the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION': expected X.Y.Z"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Require green CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --workflow ci.yml --branch main --commit "$sha" \
            --event push --limit 1 --json status,conclusion \
            --jq '.[0] | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on $sha is '$conclusion', not 'success'."
            exit 1
          fi

      - name: Bump the version
        run: python scripts/bump_version.py "$VERSION"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Create the draft GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the version's section of the changelog.
          awk -v v="$VERSION" '
            $0 ~ "^## v?" v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" -f name="Polemic v$VERSION" \
            -F body=@notes.md -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      # Signs and notarizes the macOS builds once the APPLE_* secrets exist;
      # without them the builds stay unsigned. Exported only when set, since
      # an empty APPLE_CERTIFICATE makes the Tauri bundler fail.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set; macOS build will be unsigned"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing"
              exit 1
            fi
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      # Signs the Windows builds with Azure Artifact Signing (formerly Trusted
      # Signing) once the AZURE_* secrets exist; without them the builds stay
      # unsigned. The sign command is added to tauri.conf.json here rather
      # than committed, so local Windows builds don't need Azure access.
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::warning::AZURE_CLIENT_ID not set; Windows build will be unsigned"
            exit 0
          fi
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing"
              exit 1
            fi
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          signtool="$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe | sort -V | tail -n 1)"
          echo "SIGNTOOL_PATH=$(cygpath -w "$signtool")" >> "$GITHUB_ENV"
          cargo install artifact-signing-cli --version 0.11.0 --locked
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.bundle.windows = {
              ...conf.bundle.windows,
              signCommand: `artifact-signing-cli -e ${process.argv[1]} -d Polemic %1`,
            };
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          ' "$AZURE_ARTIFACT_SIGNING_ENDPOINT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          args: ${{ matrix.args }}
